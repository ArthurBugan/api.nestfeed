[package]
name = "api-groupify"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
metrics = "0.24.6"
once_cell = "1.21.4"
rand = { version = "0.10.2", features = ["thread_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "native-tls-vendored",
] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.12.0"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "postgres",
  "macros",
  "sqlite",
  "chrono",
  "bigdecimal"
] }
tokio = { version = "1.50.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors", "request-id"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4", "v7"] }
hex = "0.4.3"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
hyper = "1.9.0"
serde_urlencoded = "0.7.1"
thiserror = "2.0.18"
tower-sessions = "0.15.0"
time = "0.3.47"
axum_typed_multipart = "0.16.5"
tower-cookies = "0.11.0"
cookie = "0.18.1"
futures = "0.3.32"
async-std = "1.13.2"
bytes = "1.11.1"
oauth2 = "4.4.2"
dotenvy = "0.15.7"

tracing-otel-extra = { version = "0.31.6", features = ["otel", "logger"] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.31.1", features = ["metrics", "grpc-tonic", "logs"] }
opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }
rust_decimal = "1.41.0"
deadpool-redis = "0.23.0"
redis = { version = "1.5.0" }
rustls = "0.23.37"
http-body-util = "0.1.3"
sea-orm = { version = "2.0.0-rc.22", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros", "debug-print" ] }
dodopayments_rust = "2.0.0"